<!DOCTYPE html>
<html lang="en">

<head>
    <title>Trabalho LMD</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous" />
</head>

<body>
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h1 class="text-center">Trabalho LMD - Algoritmo de Dijkstra</h1>
            </div>
        </div>
        <div class="row mb-5">
            <div class="col d-flex justify-content-center">
                <img style="max-width: 90vw" src="mapa.png" alt="" srcset="" />
            </div>
        </div>
        <div class="row mb-5">
            <div class="col">
                <h2>Cidade Origem:</h2>
                <select onchange="retornaMenorCaminho()" name="Cidade Origem" id="origem">
                    <option value="Capinopolis">Capinopolis</option>
                    <option value="Ituiutaba">Ituiutaba</option>
                    <option value="Itumbiara">Itumbiara</option>
                    <option value="Centralina">Centralina</option>
                    <option value="Tupaciguara">Tupaciguara</option>
                    <option value="MonteAlegre">Monte Alegre</option>
                    <option value="Douradinhos">Douradinhos</option>
                    <option value="Uberlandia">Uberlandia</option>
                    <option value="Araguari">Araguari</option>
                    <option value="CascalhoRico">Cascalho Rico</option>
                    <option value="Grupiara">Grupiara</option>
                    <option value="EstrelaDoSul">Estrela Do Sul</option>
                    <option value="Romaria">Romaria</option>
                    <option value="Indianopolis">Indianopolis</option>
                    <option value="SaoJuliana">São Juliana</option>
                </select>
            </div>
            <div class="col">
                <h2>Cidade Destino:</h2>
                <select onchange="retornaMenorCaminho()" name="Cidade Destino" id="destino">
                    <option value="Capinopolis">Capinopolis</option>
                    <option value="Ituiutaba">Ituiutaba</option>
                    <option value="Itumbiara">Itumbiara</option>
                    <option value="Centralina">Centralina</option>
                    <option value="Tupaciguara">Tupaciguara</option>
                    <option value="MonteAlegre">Monte Alegre</option>
                    <option value="Douradinhos">Douradinhos</option>
                    <option value="Uberlandia">Uberlandia</option>
                    <option value="Araguari">Araguari</option>
                    <option value="CascalhoRico">Cascalho Rico</option>
                    <option value="Grupiara">Grupiara</option>
                    <option value="EstrelaDoSul">Estrela Do Sul</option>
                    <option value="Romaria">Romaria</option>
                    <option value="Indianopolis">Indianopolis</option>
                    <option value="SaoJuliana">São Juliana</option>
                </select>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col">
                <h3 class="mb-4">Menor caminho atual:</h3>
                <h4 id="menorcaminho"></h4>
                <h4 id="menordistancia"></h4>
            </div>
        </div>
        <div class="row mt-4 mb-4">
            <div class="col">
                <h3 class="mb-4">Adicione novas cidades:</h3>
                <div class="col">
                    <div class="row">
                        <label for="nomecidade">Nome da Cidade</label>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input id="cityname" type="text">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label for="vizinho1">Vizinho 1</label>
                    </div>
                    <div class="col">
                        <label for="vizinho1">Distância 1</label>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input id="neighbor1" type="text">
                    </div>
                    <div class="col">
                        <input id="distance1" type="number">
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <label for="vizinho2">Vizinho 2</label>
                    </div>
                    <div class="col">
                        <label for="vizinho2">Distância 2</label>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <input id="neighbor2" type="text">
                    </div>
                    <div class="col">
                        <input id="distance2" type="number">
                    </div>
                </div>


                <button class="mx-auto btn btn-block w-50 btn-primary mt-4" onClick="addCidade()">ADICIONAR</button>
                <div class="alert mt-5 d-none alert-success alert-dismissible fade show" role="alert">
                    Cidade adicionada
                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
    <script src="trabalhofinal.js"></script>
</body>

</html>
